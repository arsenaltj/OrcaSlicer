    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#f6c746" stroke-width="1.8"/></marker>
    <style>.bg{fill:#101619}.lane{fill:#162126;stroke:#30434b}.line{fill:none;stroke:#f6c746;stroke-width:2.5;marker-end:url(#arrow)}.card{fill:#1d2a2f;stroke:#4b6269;stroke-width:1.5}.existing{stroke:#7bd1aa}.partial{stroke:#f6c746}.pending{stroke:#b994a2;stroke-dasharray:6 4}.white{fill:#f3f3e9}.muted{fill:#a6b9b6}.yellow{fill:#f6c746}.green{fill:#7bd1aa}.rose{fill:#d6abb8}.title{font:700 36px 'Segoe UI','Microsoft YaHei',sans-serif}.label{font:700 21px 'Segoe UI','Microsoft YaHei',sans-serif}.small{font:14px 'Segoe UI','Microsoft YaHei',sans-serif}.mono{font:13px Consolas,monospace}.tag{font:700 13px Consolas,monospace;letter-spacing:2px}</style>
  </defs>
  <rect class="bg" width="1280" height="1140"/>
  <text x="46" y="47" class="yellow tag">TECHNICAL ARCHITECTURE / 03</text><text x="46" y="94" class="white title">一份模型产物，接入 Orca 原生工程</text>
