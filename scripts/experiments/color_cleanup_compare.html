<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>人像去杂色 · 最小验证</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#202a36;font:15px "Microsoft YaHei",sans-serif}header{padding:22px 30px 14px}h1{font-size:23px;margin:0 0 8px}p{margin:6px 0;color:#637080}nav{display:flex;align-items:center;gap:8px;padding:0 30px 14px}button{border:1px solid #ccd4dd;background:white;border-radius:7px;padding:8px 15px;font:inherit;cursor:pointer}button.active{background:#007e76;color:white;border-color:#007e76}.titles{display:grid;grid-template-columns:1fr 1fr;text-align:center;font-size:18px;font-weight:bold;padding:12px}small{font-size:13px;color:#687685;font-weight:normal;margin-left:10px}canvas{display:block;width:100%;height:calc(100vh - 230px);min-height:400px;touch-action:none}footer{padding:12px 30px;color:#5b6673;font-size:13px}.pill{margin-left:auto;font-size:13px;color:#546372}#error{color:#b22}
</style>
<header><h1>颜色清理前后对照</h1><p>同一模型 · 同一六色色板 · 几何不变。拖动可同步旋转，滚轮缩放。</p></header>
<nav><button id="front">正面</button><button id="side">侧面</button><button id="back">背面</button><button id="head">脸部放大</button><button id="full">全身</button><button id="light" class="active">立体光照</button><button id="changes">标出修改区域</button><span class="pill" id="stats">正在读取模型…</span></nav>
<div class="titles"><div>A · 当前默认配色<small>真实导入结果</small></div><div>B · 保守去碎色<small>独立实验副本</small></div></div>
<canvas id="canvas"></canvas><footer id="note">这是算法实验预览，尚未修改软件默认行为，也未验证实物打印。<span id="error"></span></footer>
<script>
(async()=>{
const report=await(await fetch('result.json')).json();
const s=report.statistics;
document.querySelector('#stats').textContent=`合并 ${s.merged_regions} 个碎色区 · 改动表面积 ${(100*s.changed_area_mm2/s.surface_area_mm2).toFixed(2)}%`;
const canvas=document.querySelector('canvas'),gl=canvas.getContext('webgl2',{antialias:true,preserveDrawingBuffer:true});
if(!gl)throw Error('需要 WebGL 2');
const vs=`#version 300 es
in vec3 position;in vec3 normal;in vec2 labels;uniform mat3 basis;uniform vec3 center;uniform float extent;uniform float aspect;out vec3 n;flat out vec2 id;
void main(){vec3 p=basis*(position-center)/extent;gl_Position=vec4(p.x/aspect,p.y,-p.z/4.,1.);n=basis*normal;id=labels;}`;
const fs=`#version 300 es
precision highp float;in vec3 n;flat in vec2 id;uniform vec3 palette[6];uniform int variant;uniform bool lit;uniform bool changes;out vec4 color;
void main(){int label=int(variant==0?id.x:id.y);vec3 rgb=palette[label];if(lit){float d=max(dot(normalize(n),normalize(vec3(-.35,.55,1.))),0.);rgb*=.43+.57*d;}if(changes&&variant==1&&id.x!=id.y)rgb=vec3(1.,.05,.25);color=vec4(rgb,1.);}`;
const shader=(type,source)=>{let v=gl.createShader(type);gl.shaderSource(v,source);gl.compileShader(v);if(!gl.getShaderParameter(v,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(v));return v};
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
const bytes=await(await fetch('mesh.bin')).arrayBuffer();let buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,bytes,gl.STATIC_DRAW);
for(const [name,size,offset]of [['position',3,0],['normal',3,12],['labels',2,24]]){let at=gl.getAttribLocation(program,name);gl.enableVertexAttribArray(at);gl.vertexAttribPointer(at,size,gl.FLOAT,false,32,offset)}
const u={};for(const name of ['basis','center','extent','aspect','variant','lit','changes','palette'])u[name]=gl.getUniformLocation(program,name);
gl.uniform3fv(u.palette,new Float32Array(report.palette.flatMap(hex=>[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255))));
let yaw=Math.PI/2,pitch=.04,extent=57,center=[0,0,0],lit=true,changes=false;
function draw(){const scale=Math.min(devicePixelRatio,1.5);canvas.width=Math.round(canvas.clientWidth*scale);canvas.height=Math.round(canvas.clientHeight*scale);gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);gl.clearColor(.94,.95,.96,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);let c=Math.cos(yaw),s=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);gl.uniformMatrix3fv(u.basis,false,new Float32Array([c,-s*sp,s*cp,s,c*sp,-c*cp,0,cp,sp]));gl.uniform3fv(u.center,center);gl.uniform1f(u.extent,extent);gl.uniform1i(u.lit,lit);gl.uniform1i(u.changes,changes);const width=Math.floor(canvas.width/2);gl.uniform1f(u.aspect,width/canvas.height);for(let i=0;i<2;i++){gl.viewport(i*width,0,width,canvas.height);gl.uniform1i(u.variant,i);gl.drawArrays(gl.TRIANGLES,0,bytes.byteLength/32)}window.comparisonReady=true;}
for(const [id,fn]of Object.entries({front:()=>{yaw=Math.PI/2;pitch=.04},side:()=>{yaw=Math.PI/2+Math.PI/3;pitch=.04},back:()=>{yaw=-Math.PI/2;pitch=.04},head:()=>{center=[0,0,31];extent=20},full:()=>{center=[0,0,0];extent=57},light:()=>{lit=!lit;document.querySelector('#light').classList.toggle('active',lit)},changes:()=>{changes=!changes;document.querySelector('#changes').classList.toggle('active',changes)}}))document.getElementById(id).onclick=()=>{fn();draw()};
let drag=null;canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=()=>drag=null;canvas.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.008;pitch=Math.max(-1,Math.min(1,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];draw()};canvas.onwheel=e=>{e.preventDefault();extent=Math.max(6,Math.min(100,extent*Math.exp(e.deltaY*.001)));draw()};window.onresize=draw;draw();
})().catch(e=>{document.querySelector('#error').textContent=e.message;console.error(e)});
</script></html>
