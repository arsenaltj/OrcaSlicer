for(const m of r.modules){if(m.id==='unknown'&&!m.changed&&!m.potential)continue;const[x,y]=positions[m.id];const g=s('g',{class:`node ${m.changed?'changed':m.potential?'potential':''} ${selected===m.id?'selected':''}`,tabindex:0,role:'button','aria-label':`${m.label} 修改${m.changed} 关联${m.potential}`});g.append(s('rect',{x,y,width:210,height:66,rx:10}),s('text',{x:x+15,y:y+27,'font-size':16,fill:'#193644','font-weight':600},m.label),s('text',{x:x+15,y:y+49,'font-size':12,fill:'#587080'},`修改 ${m.changed} · 关联 ${m.potential}`));g.addEventListener('click',()=>choose(m.id));g.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();choose(m.id)}});svg.append(g)}}
function choose(id){selected=id;render();$('#detail-title').textContent=id?labels[id]:'全部模块';const box=$('#details');box.replaceChildren();const changes=r.changes.filter(c=>!id||c.module===id);box.append(el('h3',`直接修改 · ${changes.length}`));const list=el('ul');for(const c of changes){const li=el('li');li.append(el('span',c.status,'tag'),el('span',c.path,'file'));if(!c.indexed)li.append(el('div','未做代码关系解析','small'));list.append(li)}box.append(list);const potential=id?(r.potential_by_module[id]||[]):r.potential_files;box.append(el('h3','潜在关联 · '+potential.length));const plist=el('ul');for(const p of potential)plist.append(el('li',p,'file'));box.append(plist);const edges=r.relationships.filter(e=>!id||e.source===id||e.target===id);box.append(el('h3',`跨模块关系 · ${edges.length}`));const deps=el('ul');for(const e of edges)deps.append(el('li',`${labels[e.source]} → ${labels[e.target]} · ${{added:'新增',removed:'移除',existing:'现有'}[e.status]}`));box.append(deps);if(!changes.length&&!edges.length)box.append(el('p','当前试点中没有记录；不代表没有其他依赖。','small'))}
function files(){const tbody=$('#files');tbody.replaceChildren();const q=$('#search').value.toLowerCase();for(const c of r.changes.filter(c=>c.path.toLowerCase().includes(q))){const tr=el('tr');const path=el('td',undefined,'path');if(r.mode==='PR 提交'){const a=el('a',c.path);a.href=`https://github.com/arsenaltj/OrcaSlicer/blob/${c.status==='D'?r.base:r.head}/${c.path.split('/').map(encodeURIComponent).join('/')}`;a.target='_blank';a.rel='noopener';path.append(a)}else path.textContent=c.path;tr.append(el('td',c.status),path,el('td',labels[c.module]),el('td',c.indexed?'已解析':'模块标记'));tbody.append(tr)}}
$('#view').addEventListener('change',render);$('#reset').addEventListener('click',()=>choose(null));$('#search').addEventListener('input',files);choose(r.modules.find(m=>m.changed)?.id||null);files();
</script></html>
