name: Publish AI commercial candidate

# This is deliberately separate from the general Orca release publisher. The
# `ai-commercial-release` environment should have required reviewers configured,
# and AI_COMMERCIAL_RELEASE_ENABLED must be set to "true" only after that policy
# is in place. This workflow only adds assets to an empty draft release; it never
# publishes the release itself.
# GitHub exposes workflow_dispatch only for workflow files present on the default
# branch. Keep this file on the default branch (currently the integration branch)
# if that repository setting changes.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful Build all run ID from codex/orca-integration-v2'
        required: true
        type: string
      source_sha:
        description: 'Exact lowercase 40-character commit built by that run'
        required: true
        type: string
      tag:
        description: 'Existing empty draft release tag'
        required: true
        type: string

permissions:
  contents: write
  actions: read
  checks: read

concurrency:
  group: ai-commercial-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish_candidate:
    name: Verify and stage commercial AI candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ai-commercial-release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_ID: ${{ inputs.run_id }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      TAG: ${{ inputs.tag }}
      SOURCE_BRANCH: codex/orca-integration-v2
    steps:
      - name: Enforce protected release context
        env:
          RELEASE_ENABLED: ${{ vars.AI_COMMERCIAL_RELEASE_ENABLED }}
          RELEASE_PUBLISHER: ${{ vars.RELEASE_PUBLISHER }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/$SOURCE_BRANCH" ]; then
            echo "::error::Run this workflow only from $SOURCE_BRANCH; got $GITHUB_REF."
            exit 1
          fi
          if [ "$RELEASE_ENABLED" != "true" ]; then
            echo "::error::AI_COMMERCIAL_RELEASE_ENABLED must be true after protecting the ai-commercial-release environment."
            exit 1
          fi
          if [ -z "$RELEASE_PUBLISHER" ] || [ "$GITHUB_ACTOR" != "$RELEASE_PUBLISHER" ]; then
            echo "::error::Only the configured RELEASE_PUBLISHER may stage a commercial AI candidate."
            exit 1
          fi
          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::run_id must be numeric."
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be a lowercase full 40-character Git SHA."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::tag contains unsupported characters."
            exit 1
          fi

      - name: Checkout the exact candidate source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify branch head and Build all provenance
        run: |
          set -euo pipefail
          checked_out=$(git rev-parse HEAD)
          remote_head=$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | awk 'NR == 1 { print $1 }')
          if [ "$checked_out" != "$SOURCE_SHA" ] || [ "$remote_head" != "$SOURCE_SHA" ]; then
            echo "::error::Checked-out SHA, integration branch head and requested SHA must be identical."
            exit 1
          fi

          run_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
          workflow_path=$(jq -r '.path' <<<"$run_json")
          conclusion=$(jq -r '.conclusion' <<<"$run_json")
          branch=$(jq -r '.head_branch' <<<"$run_json")
          sha=$(jq -r '.head_sha' <<<"$run_json")
          event=$(jq -r '.event' <<<"$run_json")
          if [[ "$workflow_path" != ".github/workflows/build_all.yml" &&
                "$workflow_path" != .github/workflows/build_all.yml@* ]]; then
            echo "::error::Run $RUN_ID was produced by '$workflow_path', not build_all.yml."
            exit 1
          fi
          if [ "$conclusion" != "success" ] || [ "$branch" != "$SOURCE_BRANCH" ] || [ "$sha" != "$SOURCE_SHA" ]; then
            echo "::error::Build run conclusion, branch or SHA does not match the commercial candidate."
            exit 1
          fi
          case "$event" in
            push|workflow_dispatch|schedule) ;;
            *)
              echo "::error::Build event '$event' is not eligible for a commercial candidate."
              exit 1
              ;;
          esac
          echo "Verified Build all run $RUN_ID at $SOURCE_SHA."

      - name: Require a successful guardrail run at the same SHA
        id: guardrail
        run: |
          set -euo pipefail
          guardrail_json=$(gh api -X GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ai-integration-guardrails.yml/runs" \
            -f branch="$SOURCE_BRANCH" -f head_sha="$SOURCE_SHA" -f status=success -f per_page=100)
          guardrail_run=$(jq -c --arg sha "$SOURCE_SHA" --arg branch "$SOURCE_BRANCH" '
            [.workflow_runs[]
             | select(.head_sha == $sha and .head_branch == $branch and .conclusion == "success")]
            | sort_by([.run_attempt, .id]) | last // empty
          ' <<<"$guardrail_json")
          if [ -z "$guardrail_run" ]; then
            echo "::error::No successful AI integration guardrail run exists for $SOURCE_SHA."
            exit 1
          fi
          guardrail_id=$(jq -r '.id' <<<"$guardrail_run")
          guardrail_url=$(jq -r '.html_url' <<<"$guardrail_run")
          echo "run_id=$guardrail_id" >> "$GITHUB_OUTPUT"
          echo "Verified guardrail run: $guardrail_url"

      - name: Verify empty draft and target commit
        run: |
          set -euo pipefail
          if ! release_json=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json tagName,isDraft,targetCommitish,assets); then
            echo "::error::Draft release '$TAG' does not exist."
            exit 1
          fi
          if [ "$(jq -r '.tagName' <<<"$release_json")" != "$TAG" ] ||
             [ "$(jq -r '.isDraft' <<<"$release_json")" != "true" ]; then
            echo "::error::The requested release tag is not an existing draft."
            exit 1
          fi
          target=$(jq -r '.targetCommitish' <<<"$release_json")
          if [ "$target" != "$SOURCE_SHA" ]; then
            echo "::error::Draft targetCommitish '$target' must be the exact build SHA '$SOURCE_SHA'."
            exit 1
          fi
          if [ "$(jq '.assets | length' <<<"$release_json")" -ne 0 ]; then
            echo "::error::Draft '$TAG' already has assets. Use a new empty draft to prevent stale-asset mixing."
            exit 1
          fi

          tag_refs=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          if [ -n "$tag_refs" ]; then
            tag_commit=$(git fetch --quiet --no-tags origin "refs/tags/$TAG" && git rev-parse FETCH_HEAD^{commit})
            if [ "$tag_commit" != "$SOURCE_SHA" ]; then
              echo "::error::Existing tag '$TAG' resolves to '$tag_commit', not '$SOURCE_SHA'."
              exit 1
            fi
          fi

      - name: Download Windows installers and commercial manifests
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir artifacts \
            -p 'OrcaSlicer_Windows_V*_x64' \
            -p 'OrcaSlicer_Windows_V*_arm64' \
            -p "$SOURCE_SHA-commercial-ai-manifest-*"
          find artifacts -maxdepth 2 -type f -printf '%P\n' | LC_ALL=C sort

      - name: Validate commercial manifests and assemble exact asset set
        env:
          GUARDRAIL_RUN_ID: ${{ steps.guardrail.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p upload

          lock_protocol=$(jq -r '.runtime_contract.protocol_version' docs/architecture/ai-integration-lock.json)
          lock_sidecar=$(jq -r '.runtime_contract.sidecar_version' docs/architecture/ai-integration-lock.json)
          expected_arches=$'arm64\nx64'
          mapfile -d '' manifests < <(find artifacts -type f -name 'commercial-ai-build-manifest.json' -print0 | sort -z)
          if [ ${#manifests[@]} -ne 2 ]; then
            echo "::error::Expected exactly two commercial AI manifests; found ${#manifests[@]}."
            exit 1
          fi

          manifest_arches=()
          application_version=""
          for manifest in "${manifests[@]}"; do
            jq -e \
              --arg sha "$SOURCE_SHA" \
              --arg sidecar "$lock_sidecar" \
              --arg revision "ci-$SOURCE_SHA" \
              --arg x64_pillow_sha "7f84204dee22a783350679a0333981df803dac21a0190d706a50475e361c93f5" \
              --arg arm64_pillow_sha "af73337013e0b3b46f175e79492d96845b16126ddf79c438d7ea7ff27783a414" \
              --argjson protocol "$lock_protocol" '
                .schema_version == 1 and
                .source_commit == $sha and
                .distribution_channel == "commercial" and
                .package_revision == $revision and
                .sidecar_protocol_version == $protocol and
                .sidecar_version == $sidecar and
                (.application_version | type == "string" and length > 0) and
                (.architecture == "x64" or .architecture == "arm64") and
                .python_version == "3.12.13" and
                .pillow_version == "12.2.0" and
                .runtime_dependencies.schema_version == 1 and
                .runtime_dependencies.python.version == "3.12.13" and
                .runtime_dependencies.python.isolation_flag == "-I" and
                ([.runtime_dependencies.packages[]? | select(.name == "Pillow")] as $pillow |
                  ($pillow | length) == 1 and
                  $pillow[0].version == "12.2.0" and
                  $pillow[0].architecture == .architecture and
                  ($pillow[0].wheel | type == "string" and length > 0) and
                  ($pillow[0].source_url | type == "string" and startswith("https://files.pythonhosted.org/")) and
                  $pillow[0].sha256 == (if .architecture == "arm64" then $arm64_pillow_sha else $x64_pillow_sha end))
              ' "$manifest" >/dev/null || {
                echo "::error::Commercial AI manifest failed contract validation: $manifest"
                exit 1
              }
            arch=$(jq -r '.architecture' "$manifest")
            version=$(jq -r '.application_version' "$manifest")
            if [ -n "$application_version" ] && [ "$version" != "$application_version" ]; then
              echo "::error::Commercial manifests disagree on application_version."
              exit 1
            fi
            application_version="$version"
            manifest_arches+=("$arch")
            cp "$manifest" "upload/commercial-ai-build-manifest-$arch.json"
          done
          actual_arches=$(printf '%s\n' "${manifest_arches[@]}" | LC_ALL=C sort -u)
          if [ "$actual_arches" != "$expected_arches" ]; then
            echo "::error::Commercial manifests must cover exactly x64 and arm64."
            exit 1
          fi

          mapfile -d '' installers < <(find artifacts -type f -iname '*.exe' \
            -path '*OrcaSlicer_Windows_V*' ! -path '*_portable*' -print0 | sort -z)
          if [ ${#installers[@]} -ne 2 ]; then
            echo "::error::Expected exactly two Windows installers; found ${#installers[@]}."
            exit 1
          fi
          for arch in x64 arm64; do
            matches=0
            for installer in "${installers[@]}"; do
              if [[ "${installer,,}" == *"_${arch}.exe" ]]; then
                matches=$((matches + 1))
                [ -s "$installer" ] || { echo "::error::Empty installer: $installer"; exit 1; }
                cp "$installer" "upload/$(basename "$installer")"
              fi
            done
            if [ "$matches" -ne 1 ]; then
              echo "::error::Expected one $arch installer; found $matches."
              exit 1
            fi
          done

          asset_json=$(find upload -maxdepth 1 -type f -print0 | sort -z | while IFS= read -r -d '' path; do
            jq -n --arg name "$(basename "$path")" --arg sha256 "$(sha256sum "$path" | awk '{print $1}')" \
              --argjson size "$(stat -c '%s' "$path")" '{name: $name, sha256: $sha256, size_bytes: $size}'
          done | jq -s 'sort_by(.name)')
          jq -n \
            --arg sha "$SOURCE_SHA" \
            --arg branch "$SOURCE_BRANCH" \
            --arg build_run "$RUN_ID" \
            --arg guardrail_run "$GUARDRAIL_RUN_ID" \
            --arg tag "$TAG" \
            --arg version "$application_version" \
            --argjson assets "$asset_json" \
            '{
              schema: "orcaslicer.ai-commercial-release/v1",
              source_branch: $branch,
              source_commit: $sha,
              build_run_id: $build_run,
              guardrail_run_id: $guardrail_run,
              release_tag: $tag,
              application_version: $version,
              assets: $assets
            }' > upload/COMMERCIAL_AI_RELEASE_MANIFEST.json

          (
            cd upload
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\0' |
              sort -z | xargs -0 sha256sum > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
          find upload -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort

      - name: Recheck empty draft and upload without clobbering
        run: |
          set -euo pipefail
          remote_head=$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | awk 'NR == 1 { print $1 }')
          if [ "$remote_head" != "$SOURCE_SHA" ]; then
            echo "::error::Integration branch moved during verification; refusing to upload."
            exit 1
          fi
          tag_refs=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          if [ -n "$tag_refs" ]; then
            tag_commit=$(git fetch --quiet --no-tags origin "refs/tags/$TAG" && git rev-parse FETCH_HEAD^{commit})
            if [ "$tag_commit" != "$SOURCE_SHA" ]; then
              echo "::error::Tag '$TAG' moved during verification; refusing to upload."
              exit 1
            fi
          fi
          release_json=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,targetCommitish,assets)
          if [ "$(jq -r '.isDraft' <<<"$release_json")" != "true" ] ||
             [ "$(jq -r '.targetCommitish' <<<"$release_json")" != "$SOURCE_SHA" ] ||
             [ "$(jq '.assets | length' <<<"$release_json")" -ne 0 ]; then
            echo "::error::Draft release changed during verification; refusing to upload."
            exit 1
          fi

          (cd upload && sha256sum -c SHA256SUMS.txt)
          gh release upload "$TAG" upload/* --repo "$GITHUB_REPOSITORY"

          find upload -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > expected-assets.txt
          final_release=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,targetCommitish,assets)
          if [ "$(jq -r '.isDraft' <<<"$final_release")" != "true" ] ||
             [ "$(jq -r '.targetCommitish' <<<"$final_release")" != "$SOURCE_SHA" ]; then
            echo "::error::Draft state or target commit changed during upload."
            exit 1
          fi
          jq -r '.assets[].name' <<<"$final_release" |
            LC_ALL=C sort > actual-assets.txt
          if ! diff -u expected-assets.txt actual-assets.txt; then
            echo "::error::Draft assets do not exactly match the verified candidate set."
            exit 1
          fi
          echo "Commercial AI candidate staged in draft '$TAG' at $SOURCE_SHA."
