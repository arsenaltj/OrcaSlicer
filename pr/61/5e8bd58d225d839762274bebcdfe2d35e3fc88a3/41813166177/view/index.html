<script>
'use strict';
const r=JSON.parse(document.querySelector('#data').textContent),$=q=>document.querySelector(q);
const modules=Object.fromEntries(r.modules.map(m=>[m.id,m])),proofs=Object.fromEntries(r.business.evidence.map(e=>[e.id,e])),journeys=Object.fromEntries(r.business.journeys.map(j=>[j.id,j]));
const changes=new Map(r.changes.map(c=>[c.path,c])),potential=new Set(r.potential_files);
let trail=[{kind:'root',label:'平台全貌'}],animation=null;
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function btn(text,action,cls='button'){const b=el('button',text,cls);b.type='button';b.addEventListener('click',e=>action(e.currentTarget));return b}
function impact(paths){const unique=[...new Set(paths)],direct=unique.filter(p=>changes.has(p)),indirect=unique.filter(p=>potential.has(p)&&!changes.has(p));return {kind:direct.length?'changed':indirect.length?'potential':'unchanged',changed:direct,potential:indirect}}
function evidencePaths(ids){return ids.map(id=>proofs[id]?.path).filter(Boolean)}
function impactText(i){return i.kind==='changed'?'关联源码改动 '+i.changed.length:i.kind==='potential'?'潜在影响 '+i.potential.length:'无已识别改动'}
function title(kicker,name,description){const h=el('div',undefined,'stage-head');h.append(el('div',kicker,'eyebrow'),el('h1',name),el('p',description,'description'));return h}
function section(name,extra=''){const box=el('section',undefined,'section'),head=el('div',undefined,'section-title');head.append(el('h2',name),el('span',extra,'note'));box.append(head);return box}
function node(label,detail,i,action,index){const b=btn('',action,'node '+i.kind);b.append(el('span',index,'number'),el('strong',label),el('p',detail),el('span',impactText(i),'tag '+i.kind),el('span','点击放大展开 ↗','hint'));return b}
function open(view,origin){const rect=origin?.getBoundingClientRect();trail.push(view);render(rect)}
function backTo(index){if(index>=trail.length-1||index<0)return;trail=trail.slice(0,index+1);render(null,true)}

  if(!c.test_files.length) tests.append(el('p','尚未登记自动回归入口，需要在修改前确定验证方法。'));
  host.append(tests,section('该能力的全部代码文件',c.files.length+' 个文件 · '+c.lines+' 行 · '+c.indexed_files+' 个已解析'));
  catalogFiles(host,c.files); inspectImpact(c.label,c.impact);
}

function showScenario(host,id) {
  const scenario=r.catalog.scenarios.find(s=>s.id===id);
  host.append(title('CHANGE SCOPE / 02',scenario.label,'先确定谁拥有状态、谁产生候选、谁应用原生修改，再结合文件静态关系缩小检查范围。'));
  const cards=el('div',undefined,'scenario-grid');
  for(const key of scenario.capabilities) cards.append(platformCard(platformCapabilities[key]));
  host.append(cards,el('h2','相关验证'),el('p',scenario.verify,'summary-note'),
    el('p','这是维护的业务检查清单，涵盖部分静态图无法连接的数据和协议关系。不能据此省略修改实际影响的消费者。'));
  platformGuide();
}

function showCoverage(host) {
  const c=r.catalog,coverage=c.coverage;
  host.append(title('COVERAGE / 02','覆盖范围与未归属代码',
    '清单 '+coverage.inventory_files+' 个文件，静态解析 '+coverage.indexed_files+' 个，已归属 '+coverage.mapped_files+' 个。'));
  for(const line of c.limits) host.append(el('p',line));
  host.append(el('p','未进入符号解析的文件：'+coverage.unindexed_files+'；生产代码未归属：'+c.unassigned_files.length+'。测试或工程文件可能在清单内，但未归属某个产品能力。'),
    el('p','明确路径归属：'+coverage.curated_files+'；目录默认归属：'+coverage.directory_default_files+'。目录默认项只用于补齐导航，不证明其内部已解耦或完成业务审查。'),
    el('p','排除的目录由版本化 index_exclude 定义。清单不是全仓库文件计数；资源、依赖及非选定语言不在此统计中。'),
    el('p','快照清单 SHA-256 '+c.inventory_identity,'file'),section('尚未归属到能力的生产文件'));
  catalogFiles(host,c.unassigned_files); platformGuide();
}

function render(origin,reverse=false){if(animation)animation.cancel();const host=$('#stage'),v=trail.at(-1);host.replaceChildren();host.classList.remove('product-stage','platform-stage');const crumb=$('#crumb');crumb.replaceChildren();trail.forEach((item,index)=>{if(index)crumb.append(el('span','/','muted'));const b=btn(item.label,()=>backTo(index),'');if(index===trail.length-1)b.setAttribute('aria-current','location');crumb.append(b)});$('#back').disabled=trail.length===1;$('#home').disabled=trail.length===1;if(v.kind==='root'){showRoot(host);if(r.catalog)platformGuide();else introInspector()}else if(v.kind==='capability')showPlatformCapability(host,v.id);else if(v.kind==='coverage')showCoverage(host);else if(v.kind==='scenario')showScenario(host,v.id);else if(v.kind==='business'){showBusinessRoot(host);introInspector()}else if(v.kind==='domain')showDomain(host,v.id);else if(v.kind==='flow')showFlow(host,r.business.flows.find(f=>f.id===v.id));else if(v.kind==='module')showModule(host,v.id);else showDetail(host,v);if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const rect=host.getBoundingClientRect();host.style.transformOrigin=origin?(origin.left+origin.width/2-rect.left)+'px '+(origin.top+origin.height/2-rect.top)+'px':'50% 35%';animation=host.animate([{opacity:.15,transform:reverse?'scale(1.035)':'scale(.86)'},{opacity:1,transform:'scale(1)'}],{duration:260,easing:'cubic-bezier(.16,1,.3,1)'});}window.scrollTo(0,0);document.querySelector("#inspector").scrollTop=0;host.focus({preventScroll:true});$('#announcement').textContent='已展开：'+v.label}
$('#back').addEventListener('click',()=>backTo(trail.length-2));$('#home').addEventListener('click',()=>backTo(0));document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!$('#diagram-dialog').open&&trail.length>1){event.preventDefault();backTo(trail.length-2)}});
$('#archify').addEventListener('click',()=>{const v=trail.at(-1),f=r.business.flows.find(f=>f.id===(v.flow||v.id));$('#diagram-frame').src=v.kind==='root'&&r.catalog?'l0-platform.html':v.kind==='root'||v.kind==='business'?'l0-context.html':v.kind==='domain'?'l2-'+v.id+'.html':f?.journey?'l2-'+f.journey+'.html':'l1-modules.html';$('#diagram-dialog').showModal()});$('#close-diagram').addEventListener('click',()=>$('#diagram-dialog').close());
$('#version').textContent=r.mode+'\n'+r.base.slice(0,12)+' → '+r.head.slice(0,12);$('#comparison').textContent=r.mode==='PR 提交'?'当前 PR 提交范围':'当前工作区快照 · 包含未提交修改';render();
</script></html>
