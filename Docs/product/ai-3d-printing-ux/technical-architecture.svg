<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1140" role="img" aria-labelledby="title desc">
  <title id="title">OrcaSlicer AI 3D Printing UX 技术架构与能力状态</title>
  <desc id="desc">从 Figma UX 设计目标到 Workspace UI、ModelGenerationPanel、GeneratedModelArtifact、BeautyWorkbench、ColorIntent、Orca Prepare、SmartSlicing 和 Printer。节点区分已有、部分实现和待验证。</desc>
