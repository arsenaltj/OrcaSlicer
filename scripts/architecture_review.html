<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orca · 架构影响</title>
<style>
:root{font-family:Segoe UI,Microsoft YaHei,sans-serif;color:#1c2d39;background:#f3f5f7;font-size:14px}*{box-sizing:border-box}body{margin:0}header{background:#142c36;color:white;padding:30px 4vw 25px}header small{letter-spacing:3px;color:#86cfc1;font-weight:700}h1{font-size:29px;margin:9px 0}header p{color:#c1d1d9;margin:5px 0;overflow-wrap:anywhere}main{padding:24px 4vw;max-width:1800px;margin:auto}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.stat{background:white;border:1px solid #dbe2e8;border-radius:10px;padding:18px}.stat b{font-size:29px;display:block;margin-bottom:4px}.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(290px,1fr);gap:20px}.panel{border:1px solid #dbe2e8;background:white;border-radius:12px;overflow:hidden}.bar{padding:17px 20px;border-bottom:1px solid #edf0f3;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.bar h2{margin:0;font-size:17px}.bar select,.bar input,button{font:inherit;padding:7px 10px;border:1px solid #c4d2dc;border-radius:6px;background:white;color:#263d49}button{cursor:pointer}.legend{font-size:12px;padding:12px 20px;color:#566b79;line-height:1.9}.legend span{margin-right:12px}.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}svg{display:block;width:100%;height:auto;min-height:420px}.node{cursor:pointer;outline:none}.node rect{fill:#f3f6f8;stroke:#b8c8d2;stroke-width:1.5}.node.changed rect{fill:#fff0c2;stroke:#c0912b}.node.potential rect{fill:#e6efff;stroke:#6c91cf}.node.selected rect,.node:focus rect{stroke:#172f3c;stroke-width:3}.node text{pointer-events:none}.edge{fill:none;stroke:#bac5d0;stroke-width:1.3;opacity:.65}.edge.added{stroke:#008b73;stroke-width:2}.edge.removed{stroke:#bb4b5b;stroke-dasharray:6 4}.edge.focused{stroke-width:3;opacity:1}.dim{opacity:.15}.details{padding:18px;min-height:280px;max-height:650px;overflow:auto}.details h3{margin:0 0 12px}ul{padding-left:20px}li{margin:10px 0;overflow-wrap:anywhere}.file{font-family:Consolas,monospace;font-size:12px}code{background:#eef2f5;padding:2px 5px;border-radius:4px}.tag{display:inline-block;font-size:11px;padding:2px 6px;border-radius:4px;margin-right:5px;background:#e9eff3;color:#35505e}.small{font-size:12px;color:#617683;line-height:1.7}.limits{margin-top:20px;padding:18px 22px;background:#e9eff2;border-radius:10px;line-height:1.8}.all-files{margin-top:20px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 16px;border-bottom:1px solid #edf0f3}td{overflow-wrap:anywhere}td.path{font:12px Consolas,monospace}th{font-size:12px;color:#677c89}.tablewrap{max-height:390px;overflow:auto}footer{padding:20px 0;color:#657986;font-size:12px}.empty{padding:30px;color:#677c89}.wrap{overflow-wrap:anywhere}@media(max-width:900px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}header{padding:24px}main{padding:18px}svg{min-height:0}}@media(prefers-color-scheme:dark){/* Fixed light canvas keeps evidence colors consistent in exported reports. */}
</style>
<header><small>ORCA / CHANGE INTELLIGENCE</small><h1>架构影响 · 完整明细</h1><p id="identity"></p><p>从模块到文件，查看直接修改与静态依赖推测。代码关系来自 code-review-graph。</p><p><a href="index.html" style="color:#86cfc1">打开 Archify 架构总览 →</a></p></header>
<main><section class="stats" id="stats"></section><div class="layout"><section class="panel"><div class="bar"><h2>模块关系</h2><select id="view" aria-label="关系筛选"><option value="all">全部已解析关系</option><option value="delta">仅新增与移除关系</option></select><button id="reset">显示全部</button></div><div class="legend"><span><i style="background:#edbc4b"></i>直接修改</span><span><i style="background:#8caee4"></i>潜在关联</span><span style="color:#008b73">━ 新增依赖</span><span style="color:#bb4b5b">┄ 移除依赖</span><br>箭头：使用方 → 依赖方。点击模块查看文件；数字为文件数。</div><svg id="map" viewBox="0 0 840 630" role="img" aria-label="模块依赖与改动影响图"></svg></section><aside class="panel"><div class="bar"><h2 id="detail-title">选择模块</h2></div><div id="details" class="details"></div></aside></div>
<section class="limits"><b>覆盖范围与判断边界</b><ul id="limits"></ul><div class="small wrap" id="engine"></div></section>
<section class="panel all-files"><div class="bar"><h2>改动清单</h2><input id="search" type="search" placeholder="筛选文件路径…" aria-label="筛选文件路径"></div><div class="tablewrap"><table><thead><tr><th>状态</th><th>文件 / 源码入口</th><th>模块</th><th>解析覆盖</th></tr></thead><tbody id="files"></tbody></table></div></section><footer>独立 HTML · 无 CDN / 无模型 API · 可离线打开 · 不包含源码正文或凭据</footer></main>
<script type="application/json" id="data">__REPORT_DATA__</script>
<script>
'use strict';
const r=JSON.parse(document.querySelector('#data').textContent), ns='http://www.w3.org/2000/svg';
const $=s=>document.querySelector(s), labels=Object.fromEntries(r.modules.map(m=>[m.id,m.label]));
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function s(tag,attrs,text){const n=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,v);if(text!==undefined)n.textContent=text;return n}
$('#identity').textContent=`${r.mode} · ${r.base.slice(0,12)} → ${r.head.slice(0,12)} · ${r.seconds}s`;
for(const[value,label]of[[r.changes.length,'直接修改文件'],[r.potential_files.length,'潜在关联文件'],[r.graph.after_files,'试点解析文件'],[r.changes.filter(c=>!c.indexed).length,'改动中未解析的文件']]){const box=el('div',undefined,'stat');box.append(el('b',String(value)),el('span',label));$('#stats').append(box)}
r.limits.forEach(t=>$('#limits').append(el('li',t)));
$('#engine').textContent=`CRG ${r.graph.engine} · ${r.graph.nodes} 个节点 · ${r.graph.resolved_cross_file_edges} 条已解析跨文件关系 · ${r.graph.unresolved_edges} 条未解析端点关系（含外部库） · 图身份 ${r.graph.after_identity.slice(0,16)}`;
const positions={desktop:[315,32],generation:[45,160],slicing:[585,160],contracts:[315,276],adapter:[45,386],core:[585,386],tests:[315,500],engineering:[45,500],assets:[585,500],unknown:[315,160]};
let selected=null;
function render(){const svg=$('#map');svg.replaceChildren();const defs=s('defs',{}),marker=s('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});marker.append(s('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#7a919d'}));defs.append(marker);svg.append(defs);
const edges=r.relationships.filter(e=>$('#view').value!=='delta'||e.status!=='existing');
for(const e of edges){const a=positions[e.source],b=positions[e.target];if(!a||!b)continue;const dx=b[0]-a[0],dy=b[1]-a[1],sx=a[0]+105+(Math.abs(dx)>Math.abs(dy)?Math.sign(dx)*105:0),sy=a[1]+33+(Math.abs(dx)>Math.abs(dy)?0:Math.sign(dy)*33),tx=b[0]+105-(Math.abs(dx)>Math.abs(dy)?Math.sign(dx)*105:0),ty=b[1]+33-(Math.abs(dx)>Math.abs(dy)?0:Math.sign(dy)*33);const focus=selected&&(e.source===selected||e.target===selected);svg.append(s('path',{d:`M${sx},${sy} Q${(sx+tx)/2+18},${(sy+ty)/2-20} ${tx},${ty}`,class:`edge ${e.status} ${focus?'focused':''} ${selected&&!focus?'dim':''}`,'marker-end':'url(#arrow)'}))}
for(const m of r.modules){if(m.id==='unknown'&&!m.changed&&!m.potential)continue;const[x,y]=positions[m.id];const g=s('g',{class:`node ${m.changed?'changed':m.potential?'potential':''} ${selected===m.id?'selected':''}`,tabindex:0,role:'button','aria-label':`${m.label} 修改${m.changed} 关联${m.potential}`});g.append(s('rect',{x,y,width:210,height:66,rx:10}),s('text',{x:x+15,y:y+27,'font-size':16,fill:'#193644','font-weight':600},m.label),s('text',{x:x+15,y:y+49,'font-size':12,fill:'#587080'},`修改 ${m.changed} · 关联 ${m.potential}`));g.addEventListener('click',()=>choose(m.id));g.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();choose(m.id)}});svg.append(g)}}
function choose(id){selected=id;render();$('#detail-title').textContent=id?labels[id]:'全部模块';const box=$('#details');box.replaceChildren();const changes=r.changes.filter(c=>!id||c.module===id);box.append(el('h3',`直接修改 · ${changes.length}`));const list=el('ul');for(const c of changes){const li=el('li');li.append(el('span',c.status,'tag'),el('span',c.path,'file'));if(!c.indexed)li.append(el('div','未做代码关系解析','small'));list.append(li)}box.append(list);const potential=id?(r.potential_by_module[id]||[]):r.potential_files;box.append(el('h3','潜在关联 · '+potential.length));const plist=el('ul');for(const p of potential)plist.append(el('li',p,'file'));box.append(plist);const edges=r.relationships.filter(e=>!id||e.source===id||e.target===id);box.append(el('h3',`跨模块关系 · ${edges.length}`));const deps=el('ul');for(const e of edges)deps.append(el('li',`${labels[e.source]} → ${labels[e.target]} · ${{added:'新增',removed:'移除',existing:'现有'}[e.status]}`));box.append(deps);if(!changes.length&&!edges.length)box.append(el('p','当前试点中没有记录；不代表没有其他依赖。','small'))}
function files(){const tbody=$('#files');tbody.replaceChildren();const q=$('#search').value.toLowerCase();for(const c of r.changes.filter(c=>c.path.toLowerCase().includes(q))){const tr=el('tr');const path=el('td',undefined,'path');if(r.mode==='PR 提交'){const a=el('a',c.path);a.href=`https://github.com/arsenaltj/OrcaSlicer/blob/${c.status==='D'?r.base:r.head}/${c.path.split('/').map(encodeURIComponent).join('/')}`;a.target='_blank';a.rel='noopener';path.append(a)}else path.textContent=c.path;tr.append(el('td',c.status),path,el('td',labels[c.module]),el('td',c.indexed?'已解析':'模块标记'));tbody.append(tr)}}
$('#view').addEventListener('change',render);$('#reset').addEventListener('click',()=>choose(null));$('#search').addEventListener('input',files);choose(r.modules.find(m=>m.changed)?.id||null);files();
</script></html>
