<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">照片创作用户旅程与返回恢复路径</title>
  <desc id="desc">正常路径为发现想法、上传图片、AI生成设计、确认效果、生成3D、编辑优化、匹配材料、切片、打印、保存资产。黄色虚线表示不满意返回，绿色虚线表示失败恢复。</desc>
  <defs>
    <marker id="next" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1L7 4.5L1 8" fill="none" stroke="#f6c746" stroke-width="1.8"/></marker>
    <marker id="return" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1L7 4.5L1 8" fill="none" stroke="#f6c746" stroke-width="1.8"/></marker>
    <marker id="recover" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1L7 4.5L1 8" fill="none" stroke="#7bd1aa" stroke-width="1.8"/></marker>
    <style>.bg{fill:#101619}.node{fill:#1c282c;stroke:#506168;stroke-width:1.4}.finish{fill:#24392f;stroke:#7bd1aa}.white{fill:#f5f3e9}.muted{fill:#a5b8b3}.yellow{fill:#f6c746}.green{fill:#7bd1aa}.flow{fill:none;stroke:#f6c746;stroke-width:2.5;marker-end:url(#next)}.back{fill:none;stroke:#f6c746;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#return)}.retry{fill:none;stroke:#7bd1aa;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#recover)}.title{font:700 34px 'Segoe UI','Microsoft YaHei',sans-serif}.tag{font:700 13px Consolas,monospace;letter-spacing:2px}.step{font:700 19px 'Segoe UI','Microsoft YaHei',sans-serif}.small{font:14px 'Segoe UI','Microsoft YaHei',sans-serif}</style>
  </defs>
  <rect class="bg" width="1200" height="850"/>
  <text x="45" y="49" class="yellow tag">USER JOURNEY / 02</text><text x="45" y="95" class="white title">照片创作：正常路径、返回与恢复</text>
  <text x="45" y="124" class="muted small">已有模型可从编辑/准备阶段加入；历史作品可从保存资产返回当前版本继续。</text>
  <path class="flow" d="M242 230H271M470 230H499M698 230H727M926 230H955M1055 276V375M955 421H926M727 421H698M499 421H470M271 421H242"/>
  <g>
    <rect class="node" x="40" y="185" width="202" height="91" rx="13"/><text x="56" y="211" class="yellow tag">01</text><text x="56" y="246" class="white step">发现想法</text>
    <rect class="node" x="269" y="185" width="201" height="91" rx="13"/><text x="285" y="211" class="yellow tag">02</text><text x="285" y="246" class="white step">上传图片</text>
    <rect class="node" x="498" y="185" width="200" height="91" rx="13"/><text x="514" y="211" class="yellow tag">03</text><text x="514" y="246" class="white step">AI 生成设计</text>
    <rect class="node" x="727" y="185" width="199" height="91" rx="13"/><text x="743" y="211" class="yellow tag">04</text><text x="743" y="246" class="white step">确认效果</text>
    <rect class="node" x="955" y="185" width="203" height="91" rx="13"/><text x="971" y="211" class="yellow tag">05</text><text x="971" y="246" class="white step">生成 3D</text>
    <rect class="node" x="955" y="375" width="203" height="91" rx="13"/><text x="971" y="401" class="yellow tag">06</text><text x="971" y="436" class="white step">编辑优化</text>
    <rect class="node" x="727" y="375" width="199" height="91" rx="13"/><text x="743" y="401" class="yellow tag">07</text><text x="743" y="436" class="white step">匹配材料</text>
    <rect class="node" x="498" y="375" width="200" height="91" rx="13"/><text x="514" y="401" class="yellow tag">08</text><text x="514" y="436" class="white step">切片</text>
    <rect class="node" x="269" y="375" width="201" height="91" rx="13"/><text x="285" y="401" class="yellow tag">09</text><text x="285" y="436" class="white step">打印</text>
    <rect class="finish" x="40" y="375" width="202" height="91" rx="13"/><text x="56" y="401" class="green tag">10</text><text x="56" y="436" class="white step">保存资产</text>
  </g>
  <path class="back" d="M827 183V158H599V183"/><text x="617" y="153" class="yellow small">设计不满意 → 修改后重试</text>
  <path class="back" d="M1055 468V500H827V468"/><text x="846" y="521" class="yellow small">外观/材料不满意 → 返回调整</text>
  <path class="retry" d="M600 278V320H18V615H640"/><path class="retry" d="M927 618H1055V469"/>
  <rect x="640" y="561" width="287" height="111" rx="14" fill="#183128" stroke="#7bd1aa"/>
  <text x="661" y="592" class="green tag">FAILURE RECOVERY</text><text x="661" y="622" class="white step">保留输入 / 同任务查询</text><text x="661" y="650" class="muted small">保存失败留原件；过期则重切</text>
  <text x="42" y="728" class="muted small">黄色实线：目标正常路径　黄色虚线：不满意返回　绿色虚线：失败恢复（回到可继续步骤）</text>
  <text x="42" y="767" class="muted small">“打印”需要真实设备确认；“保存资产”包括模型与 Orca 工程，不代表已完成实体打印。</text>
</svg>
