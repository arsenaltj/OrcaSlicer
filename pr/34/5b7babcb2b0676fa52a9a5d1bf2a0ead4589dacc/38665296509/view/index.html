<script>
'use strict';
const r=JSON.parse(document.querySelector('#data').textContent),$=q=>document.querySelector(q);
const modules=Object.fromEntries(r.modules.map(m=>[m.id,m])),proofs=Object.fromEntries(r.business.evidence.map(e=>[e.id,e])),journeys=Object.fromEntries(r.business.journeys.map(j=>[j.id,j]));
const changes=new Map(r.changes.map(c=>[c.path,c])),potential=new Set(r.potential_files);
let trail=[{kind:'root',label:'业务全貌'}],animation=null;
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function btn(text,action,cls='button'){const b=el('button',text,cls);b.type='button';b.addEventListener('click',e=>action(e.currentTarget));return b}
function impact(paths){const unique=[...new Set(paths)],direct=unique.filter(p=>changes.has(p)),indirect=unique.filter(p=>potential.has(p)&&!changes.has(p));return {kind:direct.length?'changed':indirect.length?'potential':'unchanged',changed:direct,potential:indirect}}
function evidencePaths(ids){return ids.map(id=>proofs[id]?.path).filter(Boolean)}
function impactText(i){return i.kind==='changed'?'关联源码改动 '+i.changed.length:i.kind==='potential'?'潜在影响 '+i.potential.length:'无已识别改动'}
function title(kicker,name,description){const h=el('div',undefined,'stage-head');h.append(el('div',kicker,'eyebrow'),el('h1',name),el('p',description,'description'));return h}
function section(name,extra=''){const box=el('section',undefined,'section'),head=el('div',undefined,'section-title');head.append(el('h2',name),el('span',extra,'note'));box.append(head);return box}
function node(label,detail,i,action,index){const b=btn('',action,'node '+i.kind);b.append(el('span',index,'number'),el('strong',label),el('p',detail),el('span',impactText(i),'tag '+i.kind),el('span','点击放大展开 ↗','hint'));return b}
function open(view,origin){const rect=origin?.getBoundingClientRect();trail.push(view);render(rect)}
function backTo(index){if(index>=trail.length-1||index<0)return;trail=trail.slice(0,index+1);render(null,true)}
function drawModules(ids,host){const grid=el('div',undefined,'modules');for(const id of [...new Set(ids)]){const m=modules[id];if(!m)continue;const kind=m.changed?'changed':m.potential?'potential':'unchanged',b=btn('',origin=>open({kind:'module',id,label:m.label},origin),'module '+kind),text=el('div');text.append(el('b',m.label),el('small',m.changed+' 直接修改 · '+m.potential+' 潜在影响'));b.append(text,el('span','↗'));grid.append(b)}host.append(grid)}
function introInspector(){const box=$('#inspector');box.replaceChildren(el('div','READING GUIDE','eyebrow'),el('h2','先找业务主线，再看改动'),el('p','左侧是模型生成，右侧上方是智能切片。点击分区标题展开完整主线，点击小卡片进入对应业务细节。'),el('p','右侧保留具体依据。顶部路径、“缩回上层”和 Esc 帮助返回。'));const counts=el('div',undefined,'counts');for(const [n,t]of[[r.changes.length,'改动文件'],[r.potential_files.length,'潜在关联']]){const d=el('div');d.append(el('b',n),el('span',t));counts.append(d)}box.append(counts,el('div',r.mode==='PR 提交'?'当前是所标注 PR 提交范围。':'当前预览包含工作区未提交修改；不是某个已提交 PR 的结果。','summary-note'),el('p','灰色仅表示分析范围内没有识别到改动，不表示测试通过。'),el('p','紫色虚线是未做能力；点击查看目标输入和输出。关系线可点击查看业务约束。'))}
function inspectFile(path,line,removed=false){const box=$('#inspector'),c=changes.get(path),i=impact([path]);box.replaceChildren(el('div','SOURCE EVIDENCE','eyebrow'),el('h2','源码依据'),el('span',c?'直接修改 '+c.status:i.kind==='potential'?'潜在影响':'无直接修改','tag '+i.kind),el('p',path+(line?':'+line:''),'file'),el('p','颜色仅说明文件级关系，不能证明某个函数或业务条件已经改变。'));for(const e of r.business.evidence.filter(e=>e.path===path)){const p=el('div',undefined,'proof');p.append(el('strong',e.id,'file'),el('p',e.found?'行 '+e.line+' · '+e.needle:'锚点缺失 · '+e.needle,'file'),el('p',e.sha256?'SHA-256 '+e.sha256:'当前版本无可读源文件','file'));box.append(p)}if(r.mode==='PR 提交'){const a=el('a','在 GitHub 查看所选版本','button');a.href='https://github.com/arsenaltj/OrcaSlicer/blob/'+(removed||c?.status==='D'?r.base:r.head)+'/'+path.split('/').map(encodeURIComponent).join('/')+(line?'#L'+line:'');a.target='_blank';a.rel='noopener';box.append(a)}else box.append(el('p','工作区源码位置如上；哈希对应本次报告。'));box.append(el('p',removed?'所选状态来自基线版本；锚点信息来自当前版本。':'这不是正在运行的任务状态。'))}
function fileButton(path,line){const i=impact([path]),b=btn('',()=>inspectFile(path,line),'file-button '+i.kind);b.append(el('span',changes.has(path)?'直接修改 '+changes.get(path).status:potential.has(path)?'潜在影响':'源码入口','tag '+i.kind),el('div',path+(line?':'+line:''),'file'));return b}
function proofButtons(ids,host){for(const id of [...new Set(ids)]){const e=proofs[id];if(e)host.append(fileButton(e.path,e.line))}}
function inspectImpact(label,i){const box=$('#inspector');box.replaceChildren(el('div','CHANGE EVIDENCE','eyebrow'),el('h2',label),el('span',impactText(i),'tag '+i.kind),el('p','业务入口和阶段按各自源码锚点的文件改动汇总；代码模块按完整模块范围统计。文件变化不代表所有业务条件都变了。'));for(const p of [...i.changed,...i.potential].slice(0,7))box.append(fileButton(p));if(i.changed.length+i.potential.length>7)box.append(el('p','此处展示前 7 项；模块中可查看完整列表。'));if(!i.changed.length&&!i.potential.length)box.append(el('p','没有识别到相关文件改动；不等于完成验证。'))}
function capability(item){const f=r.business.flows.find(f=>f.id===item.flow),m=modules[item.module],i=f?f.impact:{kind:m.changed?'changed':m.potential?'potential':'unchanged'};const b=btn('',origin=>f?open({kind:'flow',id:f.id,label:f.label},origin):open({kind:'module',id:m.id,label:m.label},origin),'capability '+i.kind);b.append(el('strong',item.label),el('p',item.detail),el('span',f?impactText(i):m.changed+' 模块改动 · '+m.potential+' 潜在影响','tag '+i.kind));return b}
function businessDomain(id,label,description,ids){const box=el('section',undefined,'domain '+id),head=el('div',undefined,'domain-head'),titleBox=el('div');titleBox.append(btn(label,origin=>open({kind:'domain',id,label},origin),'domain-link'),el('p',description,'domain-description'));head.append(titleBox,btn('展开主线 ↗',origin=>open({kind:'domain',id,label},origin),'button'));box.append(head);const grid=el('div',undefined,'domain-grid');for(const key of ids){const f=r.business.flows.find(f=>f.id===key),b=node(f.label,f.detail,f.impact,origin=>open({kind:'flow',id:f.id,label:f.label},origin),'');grid.append(b)}box.append(grid);return box}
function showPlanned(item){const box=$('#inspector');box.replaceChildren(el('div','PLANNED CAPABILITY','eyebrow'),el('h2',item.label),el('span','未做','todo-tag'),el('p',item.detail),el('h3','输入'),el('p',item.input),el('h3','要产出什么'),el('p',item.output),el('p','这是目标能力占位；不关联已通过验证的实现，也不参与 PR 改动计数。'))}
function plannedCard(item){const b=btn('',()=>showPlanned(item),'capability todo');b.append(el('strong',item.label),el('span','未做','todo-tag'),el('p',item.detail));return b}
function todoRow(items){const row=el('div',undefined,'todo-row');for(const item of items)row.append(plannedCard(item));return row}
function relation(id){const edge=r.business.overview.relations.find(e=>e.id===id);const b=btn(edge.label+(edge.planned?' · 未做':''),()=>{const box=$('#inspector');box.replaceChildren(el('div','BUSINESS RELATION','eyebrow'),el('h2',edge.label),el('p',edge.source+' → '+edge.target),el('span',edge.planned?'未做 · 目标关系':'业务关系','tag'),el('p',edge.detail),el('p','连线为维护的业务逻辑关系，不等于 CRG 自动识别的函数调用。'))},'relation'+(edge.planned?' planned':''));return b}
function showRoot(host){host.classList.add('product-stage');host.append(title('PRODUCT ARCHITECTURE / 01','从 AI 能力到打印结果','实线看现有业务衔接，虚线看未做目标；点击模块展开，点击关系查看输入、输出和约束。'));const o=r.business.overview,services=el('div',undefined,'service-row');services.append(capability(o.services[0]),plannedCard(o.planned.services[0]),plannedCard(o.planned.services[1]));host.append(services);const links=el('div',undefined,'service-links');links.append(relation('generate-service'),relation('plan-dispatch'));host.append(links,el('div','紫色虚线 + 未做 = 目标占位；橙色 / 蓝色只表示当前 PR 的直接修改 / 潜在影响。','relation-legend'));const map=el('div',undefined,'product-grid');const generation=businessDomain('generation','模型生成','设计输入 → 确认生成 → 结果 / 历史 → 导入',['design','confirmation','generation','results','history','import']);generation.append(el('div','待补齐的目标能力','todo-heading'),todoRow(o.planned.generation),el('p','输出：模型产物、颜色与可打印性信息。由用户确认交给 Orca。','domain-note'));const slicing=businessDomain('slicing','智能切片','读取 Orca 工作区，比较方案，再由用户确认应用',['inspection','comparison','decision','slicing']);const current=slicing.querySelector('.domain-grid');slicing.insertBefore(el('div','目标能力 · 未做', 'todo-heading'),current);slicing.insertBefore(todoRow(o.planned.slicing),current);slicing.insertBefore(el('div','当前已定位的业务主线（点击继续展开）','current-label'),current);slicing.append(el('p','已有源码主线包含 '+journeys.slicing.states.length+' 个状态；不将已有试切和应用能力当作上方自动优化闭环已经完成。','domain-note'));const bridge=el('div',undefined,'logic-bridge');bridge.append(relation('workspace-read'),relation('slice-apply'));const native=el('section',undefined,'domain native');native.append(el('h2','OrcaSlicer 原生能力'));const handoff=relation('model-import');handoff.classList.add('handoff-relation');native.append(handoff);const row=el('div',undefined,'native-row');for(const item of o.native)row.append(capability(item));native.append(row,relation('native-pipeline'));map.append(generation,slicing,bridge,native);host.append(map);const support=relation('foundation-support');support.classList.add('support-link');host.append(support);const base=el('section',undefined,'domain foundation');base.append(el('h2','AI 交互与平台底座'));const baseGrid=el('div',undefined,'foundation-grid');for(const item of o.foundation)baseGrid.append(capability(item));base.append(baseGrid,todoRow(o.planned.foundation));host.append(base);const allRelations=el('details',undefined,'section');allRelations.append(el('summary','查看完整模块关系与业务约束'));const list=el('div',undefined,'relation-list');for(const edge of o.relations)list.append(relation(edge.id));allRelations.append(list);host.append(allRelations);const modulesBox=el('details',undefined,'section');modulesBox.append(el('summary','展开全部代码模块与 PR 修改分布'));drawModules(r.modules.filter(m=>m.id!=='unknown'||m.changed||m.potential).map(m=>m.id),modulesBox);host.append(modulesBox)}

function showDomain(host,id){const entries=r.business.flows.filter(f=>f.journey===id),base=entries[0],j=journeys[id],evidence=[...new Set(entries.flatMap(f=>f.evidence))];showFlow(host,{...base,label:j.label,detail:j.description,boundary:'这是当前源码中的完整业务主线；点击阶段继续展开。',phase_ids:null,evidence,modules:id==='slicing'?['slicing','contracts','adapter']:['generation','adapter'],impact:impact(evidencePaths(evidence))})}

function showFlow(host,f){const j=journeys[f.journey];host.append(title('BUSINESS / 02',f.label,f.detail));if(f.boundary)host.append(el('p',f.boundary,'summary-note'));if(j){const phases=j.phases.filter(p=>!f.phase_ids||f.phase_ids.includes(p.id));const row=el('div',undefined,'flow scoped');for(const [index,p]of phases.entries())row.append(node(p.label,p.detail,p.impact,origin=>open({kind:'phase',flow:f.id,id:p.id,label:p.label},origin),'0'+(index+1)));host.append(row);const phaseStates=new Set(j.phases.flatMap(p=>p.states)),branch=j.states.filter(s=>!phaseStates.has(s.name)||s.delta!=='existing'),sec=section('整条'+j.label+'流程的其他状态','非当前入口专属；清单不虚构转移'),chips=el('div',undefined,'branches');for(const s of branch)chips.append(btn(s.name+(s.delta==='existing'?'':s.delta==='added'?' · 新增':' · 移除'),origin=>open({kind:'state',flow:f.id,id:s.name,label:s.meaning},origin),'chip '+impact([s.path]).kind));chips.append(btn('全部 '+j.states.length+' 个状态',origin=>open({kind:'states',flow:f.id,label:'全部状态'},origin),'chip'));sec.append(chips);host.append(sec);const rules=section('相关业务条件与恢复路径'),rowRules=el('div',undefined,'branches');for(const rule of j.rules.filter(rule=>rule.evidence.some(id=>f.evidence.includes(id))))rowRules.append(btn(rule.title,origin=>open({kind:'rule',flow:f.id,id:rule.title,label:rule.title},origin),'chip '+impact(evidencePaths(rule.evidence)).kind));rules.append(rowRules);host.append(rules)}else{const proof=section('业务实现入口');proofButtons(f.evidence,proof);host.append(proof,el('div','此段当前只有源码入口映射，尚未维护更细的业务状态机。','summary-note'))}const mods=section('实现这段业务的模块');drawModules(f.modules,mods);host.append(mods);inspectImpact(f.label,f.impact)}
function stateCard(s){const i=impact([s.path]),b=btn('',()=>{inspectFile(s.path,s.line,s.delta==='removed');$('#inspector').prepend(el('h3',s.name),el('p',s.meaning))},'node state '+i.kind);b.append(el('strong',s.name),el('p',s.meaning),el('span',s.delta==='added'?'新增状态':s.delta==='removed'?'移除状态':impactText(i),'tag '+i.kind));return b}
function showDetail(host,v){const f=r.business.flows.find(f=>f.id===v.flow),j=journeys[f.journey],p=v.kind==='phase'?j.phases.find(p=>p.id===v.id):null,rule=v.kind==='rule'?j.rules.find(rule=>rule.title===v.id):null;host.append(title('LOGIC / 03',v.label,p?.detail||rule?.detail||'点击状态查看源码依据；移除状态保留基线定位。'));let states=j.states;if(p)states=states.filter(s=>p.states.includes(s.name));if(v.kind==='state')states=states.filter(s=>s.name===v.id);const layout=el('div',undefined,'two'),left=section(rule?'业务约束':'源码状态'),right=section('实现入口与关联模块');if(rule)left.append(el('div',rule.detail,'summary-note'));else{const grid=el('div',undefined,'state-grid');for(const s of states)grid.append(stateCard(s));left.append(grid);if(!states.length)left.append(el('p','此阶段是界面操作，没有独立 Job 状态；请看实现入口。','description'))}const ids=p?.evidence||rule?.evidence||[j.state_source];proofButtons(ids,right);drawModules(ids.map(id=>proofs[id]?.module).filter(Boolean),right);layout.append(left,right);host.append(layout);inspectImpact(v.label,p?.impact||impact(evidencePaths(ids)));if(v.kind==='state'&&states[0])inspectFile(states[0].path,states[0].line,states[0].delta==='removed')}
function showModule(host,id){const m=modules[id];host.append(title('CODE / 04',m.label,m.purpose),el('p',m.changed+' 个直接修改 · '+m.potential+' 个潜在影响','description'));const search=el('input');search.type='search';search.placeholder='筛选文件路径';search.setAttribute('aria-label','筛选模块文件');search.className='search section';host.append(search);const list=el('div',undefined,'files section');host.append(list);const paths=new Set(r.changes.filter(c=>c.module===id).map(c=>c.path));for(const p of r.potential_by_module[id]||[])paths.add(p);for(const e of r.business.evidence)if(e.module===id)paths.add(e.path);const ordered=[...paths].sort((a,b)=>Number(changes.has(b))-Number(changes.has(a))||a.localeCompare(b));function draw(){list.replaceChildren();for(const p of ordered.filter(p=>p.toLowerCase().includes(search.value.toLowerCase())))list.append(fileButton(p));if(!list.childElementCount)list.append(el('p','没有匹配文件。','muted'))}search.addEventListener('input',draw);draw();const box=$('#inspector');box.replaceChildren(el('div','MODULE / '+id,'eyebrow'),el('h2',m.label),el('p',m.purpose),el('p','点击文件查看改动标记、源码锚点和版本依据。'),el('p','模块直接修改来自 Git；潜在影响来自反向依赖分析，不能当成业务实际发生变化。'))}
function render(origin,reverse=false){if(animation)animation.cancel();const host=$('#stage'),v=trail.at(-1);host.replaceChildren();host.classList.remove('product-stage');const crumb=$('#crumb');crumb.replaceChildren();trail.forEach((item,index)=>{if(index)crumb.append(el('span','/','muted'));const b=btn(item.label,()=>backTo(index),'');if(index===trail.length-1)b.setAttribute('aria-current','location');crumb.append(b)});$('#back').disabled=trail.length===1;$('#home').disabled=trail.length===1;if(v.kind==='root'){showRoot(host);introInspector()}else if(v.kind==='domain')showDomain(host,v.id);else if(v.kind==='flow')showFlow(host,r.business.flows.find(f=>f.id===v.id));else if(v.kind==='module')showModule(host,v.id);else showDetail(host,v);if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const rect=host.getBoundingClientRect();host.style.transformOrigin=origin?(origin.left+origin.width/2-rect.left)+'px '+(origin.top+origin.height/2-rect.top)+'px':'50% 35%';animation=host.animate([{opacity:.15,transform:reverse?'scale(1.035)':'scale(.86)'},{opacity:1,transform:'scale(1)'}],{duration:260,easing:'cubic-bezier(.16,1,.3,1)'});}window.scrollTo(0,0);document.querySelector("#inspector").scrollTop=0;host.focus({preventScroll:true});$('#announcement').textContent='已展开：'+v.label}
$('#back').addEventListener('click',()=>backTo(trail.length-2));$('#home').addEventListener('click',()=>backTo(0));document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!$('#diagram-dialog').open&&trail.length>1){event.preventDefault();backTo(trail.length-2)}});
$('#archify').addEventListener('click',()=>{const v=trail.at(-1),f=r.business.flows.find(f=>f.id===(v.flow||v.id));$('#diagram-frame').src=v.kind==='root'?'l0-context.html':v.kind==='domain'?'l2-'+v.id+'.html':f?.journey?'l2-'+f.journey+'.html':'l1-modules.html';$('#diagram-dialog').showModal()});$('#close-diagram').addEventListener('click',()=>$('#diagram-dialog').close());
$('#version').textContent=r.mode+'\n'+r.base.slice(0,12)+' → '+r.head.slice(0,12);$('#comparison').textContent=r.mode==='PR 提交'?'当前 PR 提交范围':'当前工作区快照 · 包含未提交修改';render();
</script></html>
